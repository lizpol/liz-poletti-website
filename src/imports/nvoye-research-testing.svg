<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dadbd9"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="1" dy="4" stdDeviation="3" flood-opacity=".1"/></filter></defs><rect width="900" height="840" rx="16" fill="#fafaf7"/><rect width="900" height="840" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="40" y="40" font-size="14" fill="#687789" letter-spacing="2">07 / USABILITY FINDINGS</text><text x="40" y="83" font-size="29" fill="#172333">What testing told us to revisit</text><text x="40" y="121" font-size="14" fill="#687789">RESEARCH NOTE</text><text x="500" y="121" font-size="14" fill="#687789">DESIGN QUESTION / OPPORTUNITY</text><g transform="rotate(-0.6 215 233)"><rect x="40" y="143" width="350" height="182" fill="#ffdf91" filter="url(#shadow)"/><path d="M370 325 l20 -20 v20z" fill="#000" opacity=".05"/><text x="60" y="175" font-size="18" font-weight="600" fill="#253044">Where do I begin?</text><text x="60" y="202" font-size="18" font-weight="400" fill="#253044">Participants asked for clearer</text><text x="60" y="229" font-size="18" font-weight="400" fill="#253044">starting guidance and question</text><text x="60" y="256" font-size="18" font-weight="400" fill="#253044">context.</text></g><g transform="rotate(-0.6 675 233)"><rect x="500" y="143" width="350" height="182" fill="#d7efdf" filter="url(#shadow)"/><path d="M830 325 l20 -20 v20z" fill="#000" opacity=".05"/><text x="520" y="175" font-size="18" font-weight="400" fill="#253044">Design implication: explain</text><text x="520" y="202" font-size="18" font-weight="400" fill="#253044">the next step and its purpose</text></g><path d="M405 228 Q450 216 481 231 m-12 -8 l12 8 -13 5" fill="none" stroke="#7e8793" stroke-width="2"/><g transform="rotate(0.5 215 443)"><rect x="40" y="353" width="350" height="182" fill="#ffbdb4" filter="url(#shadow)"/><path d="M370 535 l20 -20 v20z" fill="#000" opacity=".05"/><text x="60" y="385" font-size="18" font-weight="600" fill="#253044">Who is in this group?</text><text x="60" y="412" font-size="18" font-weight="400" fill="#253044">Some wanted member and activity</text><text x="60" y="439" font-size="18" font-weight="400" fill="#253044">information before deciding to</text><text x="60" y="466" font-size="18" font-weight="400" fill="#253044">join.</text></g><g transform="rotate(0.5 675 443)"><rect x="500" y="353" width="350" height="182" fill="#d7efdf" filter="url(#shadow)"/><path d="M830 535 l20 -20 v20z" fill="#000" opacity=".05"/><text x="520" y="385" font-size="18" font-weight="400" fill="#253044">Design implication: show</text><text x="520" y="412" font-size="18" font-weight="400" fill="#253044">context before commitment</text></g><path d="M405 438 Q450 426 481 441 m-12 -8 l12 8 -13 5" fill="none" stroke="#7e8793" stroke-width="2"/><g transform="rotate(-0.4 215 653)"><rect x="40" y="563" width="350" height="182" fill="#d7c8ff" filter="url(#shadow)"/><path d="M370 745 l20 -20 v20z" fill="#000" opacity=".05"/><text x="60" y="595" font-size="18" font-weight="600" fill="#253044">When can I invite others?</text><text x="60" y="622" font-size="18" font-weight="400" fill="#253044">Participants expected invitations</text><text x="60" y="649" font-size="18" font-weight="400" fill="#253044">while creating an event.</text></g><g transform="rotate(-0.4 675 653)"><rect x="500" y="563" width="350" height="182" fill="#d7efdf" filter="url(#shadow)"/><path d="M830 745 l20 -20 v20z" fill="#000" opacity=".05"/><text x="520" y="595" font-size="18" font-weight="400" fill="#253044">Design implication: review the</text><text x="520" y="622" font-size="18" font-weight="400" fill="#253044">invitation step in the flow</text></g><path d="M405 648 Q450 636 481 651 m-12 -8 l12 8 -13 5" fill="none" stroke="#7e8793" stroke-width="2"/><text x="40" y="808" font-size="13" fill="#687789">Recreated summary of team research · Paraphrased notes, not participant quotations</text></g></svg>